<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141b16">
  <title>Ekans 🐍</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      color: #f2f4ec;
      background: #141b16;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
    }
    #game {
      height: 100vh;
      height: 100dvh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 8px;
      padding: max(6px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right))
        max(6px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
    }
    .game-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 30px;
    }
    .game-bar h1 {
      margin: 0;
      font-size: clamp(1rem, 3.5vw, 1.3rem);
    }
    #boardArea {
      display: grid;
      place-items: center;
      min-width: 0;
      min-height: 0;
    }
    canvas {
      display: block;
      box-shadow: 0 0 0 1px #64705f;
      cursor: crosshair;
      touch-action: manipulation;
      user-select: none;
    }
    #stats {
      font-variant-numeric: tabular-nums;
      font-size: clamp(0.8rem, 2.9vw, 1rem);
      white-space: nowrap;
    }
    #hint {
      margin: 0;
      color: #c4d2be;
      font-size: 0.84rem;
      line-height: 1.3;
      text-align: center;
    }
    #overlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
        max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      overflow: auto;
      background: #0d1511cb;
    }
    #overlay[hidden] { display: none; }
    .overlay-content {
      width: min(100%, 430px);
      padding: clamp(16px, 4vw, 28px);
      border: 1px solid #50684e;
      border-radius: 18px;
      background: #1b291f;
      text-align: center;
      box-shadow: 0 12px 32px #0005;
    }
    .overlay-title {
      margin: 0;
      font-size: clamp(1.65rem, 5vw, 2.3rem);
    }
    .overlay-message {
      margin: 8px 0 18px;
      color: #c4d2be;
      line-height: 1.4;
    }
    #modeButtons {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .mode-button {
      display: grid;
      justify-items: center;
      gap: 4px;
      min-height: 72px;
      padding: 8px;
      cursor: pointer;
      touch-action: manipulation;
      background: #2b4130;
      border: 1px solid #62805e;
      border-radius: 12px;
      color: inherit;
      font: inherit;
    }
    .mode-button:hover, .mode-button:active { background: #3c5941; }
    .mode-button:focus-visible { outline: 2px solid #c3e79a; outline-offset: 2px; }
    .mode-icon { font-size: 1.65rem; line-height: 1.1; }
    .mode-note { color: #d3e0cd; font-size: 0.76rem; }
    /* Game-over animations */
    @keyframes chessFinish {
      0% { transform: scale(0.5); opacity: 0; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .chessFinishAnimation {
      animation: chessFinish 1s ease-out;
    }
    @keyframes trainFinish {
      0% { transform: translateY(20px) rotate(10deg); opacity: 0; }
      50% { transform: translateY(-10px) rotate(-5deg); opacity: 1; }
      100% { transform: translateY(0) rotate(0deg); opacity: 1; }
    }
    .trainFinishAnimation {
      animation: trainFinish 1s ease-out;
    }
    @media (prefers-reduced-motion: reduce) {
      .chessFinishAnimation, .trainFinishAnimation { animation: none; }
    }
  </style>
</head>
<body>
  <main id="game">
    <header class="game-bar">
      <h1>Ekans <span aria-hidden="true">🐍</span></h1>
      <div id="stats" title="Time, steps and food eaten"></div>
    </header>
    <div id="boardArea">
      <canvas id="gameCanvas" aria-label="Snake game board"></canvas>
    </div>
    <p id="hint" aria-live="polite">Tap or click an empty tile to place or move food.</p>
  </main>

  <div id="overlay" role="dialog" aria-modal="true" aria-labelledby="overlayTitle">
    <div class="overlay-content">
      <h2 id="overlayTitle" class="overlay-title">🔄🐍🎮 Ekans</h2>
      <p id="overlayMessage" class="overlay-message">Place food on an empty tile. The snake will find its way to it.</p>
      <div id="modeButtons">
        <button id="chessButton" class="mode-button" type="button">
          <span class="mode-icon" aria-hidden="true">♟️</span>
          <strong>Chess</strong>
          <span class="mode-note">Moves when fed</span>
        </button>
        <button id="trainButton" class="mode-button" type="button">
          <span class="mode-icon" aria-hidden="true">🚃</span>
          <strong>Train</strong>
          <span class="mode-note">Keeps moving</span>
        </button>
      </div>
    </div>
  </div>
  
  <script>
    // ------------------------------
    // Global Variables and Constants
    // ------------------------------
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const boardArea = document.getElementById("boardArea");
    const stats = document.getElementById("stats");
    const hint = document.getElementById("hint");
    const defaultHint = hint.textContent;
    const overlay = document.getElementById("overlay");
    const overlayTitle = document.getElementById("overlayTitle");
    const overlayMessage = document.getElementById("overlayMessage");
    const fixedTick = 200; // initial tick time in ms
    const minimumTick = 90;

    let columns, rows, cellSize;
    let rotated = false;
    let snake = [];
    let treat = null;
    let lastVisit;
    let detourSteps = 0;
    let startTime;
    let tickCount = 0;
    let treatsEaten = 0;
    let gameOver = true;
    let mode = null;
    let trainBoardColors = [];
    let currentTickInterval = fixedTick;
    let tickTimeout = null;

    // ------------------------------
    // Sonification Setup
    // ------------------------------
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    let noiseBuffer;

    function enableAudio() {
      if (!AudioContextClass) return;
      try {
        if (!audioCtx) {
          const context = new AudioContextClass();
          noiseBuffer = context.createBuffer(1, context.sampleRate, context.sampleRate);
          const data = noiseBuffer.getChannelData(0);
          for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
          audioCtx = context;
        }
        if (audioCtx.state !== "running") audioCtx.resume().catch(() => {});
      } catch {
        // Audio is optional when the browser cannot initialize it.
      }
    }

    // ------------------------------
    // Pitch Mapping Function
    // ------------------------------
    function getSquareFrequency(x, y) {
      let index = y * columns + x;
      const period = 111;
      let modIndex = index % period;
      let noteNumber;
      if (modIndex < 56) {
        noteNumber = modIndex;
      } else {
        let descendingIndex = modIndex - 56;
        noteNumber = 54 - descendingIndex;
      }
      const scale = [0, 2, 4, 6, 7, 9, 11];
      let degree = noteNumber % 7;
      let octave = 2 + Math.floor(noteNumber / 7);
      let semitoneOffset = scale[degree] + 12 * (octave - 2);
      let baseFreq = 65.41; // C2
      return baseFreq * Math.pow(2, semitoneOffset / 12);
    }

    // ------------------------------
    // Scheduling Functions for Sonification
    // ------------------------------
    function scheduleSynthPluck(freq, duration, startTimeScheduled) {
      let osc = audioCtx.createOscillator();
      let gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0, startTimeScheduled);
      gain.gain.linearRampToValueAtTime(0.7, startTimeScheduled + Math.min(0.01, duration / 2));
      gain.gain.exponentialRampToValueAtTime(0.001, startTimeScheduled + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(startTimeScheduled);
      osc.stop(startTimeScheduled + duration);
    }

    function scheduleHiHatPluck(duration, startTimeScheduled) {
      let noise = audioCtx.createBufferSource();
      noise.buffer = noiseBuffer;
      let filter = audioCtx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.value = 7000;
      let gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.5, startTimeScheduled);
      gain.gain.exponentialRampToValueAtTime(0.01, startTimeScheduled + duration);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start(startTimeScheduled, Math.random() * (noiseBuffer.duration - duration));
      noise.stop(startTimeScheduled + duration);
    }

    // ------------------------------
    // Kick Drum Sound (for treat eaten)
    // ------------------------------
    function playKickDrum() {
      let osc = audioCtx.createOscillator();
      let gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(100, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.2);
      gain.gain.setValueAtTime(1.0, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.2);
    }

    // ------------------------------
    // Sonification: Head Sound & Burst Sequence
    // ------------------------------
    function playHeadSound(x, y) {
      const headSoundDuration = 0.1;
      let freq = getSquareFrequency(x, y);
      scheduleSynthPluck(freq, headSoundDuration, audioCtx.currentTime);
      scheduleHiHatPluck(headSoundDuration, audioCtx.currentTime);
    }

    function playSnakeBurst() {
      const noteCount = Math.min(snake.length, 20);
      const duration = fixedTick / 1000 / noteCount;
      const stride = (snake.length - 1) / Math.max(1, noteCount - 1);
      const now = audioCtx.currentTime;
      for (let i = 0; i < noteCount; i++) {
        const segment = snake[Math.round(i * stride)];
        const freq = getSquareFrequency(segment.x, segment.y);
        scheduleSynthPluck(freq, duration, now + i * duration);
        scheduleHiHatPluck(duration, now + i * duration);
      }
    }

    function playMoveSounds(head, ate) {
      if (audioCtx?.state !== "running") return;
      try {
        playHeadSound(head.x, head.y);
        playSnakeBurst();
        if (ate) playKickDrum();
      } catch {
        audioCtx.suspend().catch(() => {});
      }
    }

    // ------------------------------
    // Color Helper Functions
    // ------------------------------
    function chooseTrainBoardBase() {
      const bases = [
        { name: "pink", h: 340, s: 70, l: 85 },
        { name: "blue", h: 210, s: 50, l: 40 },
        { name: "grey", h: 0, s: 0, l: 50 }
      ];
      return bases[Math.floor(Math.random() * bases.length)];
    }
    function randomVariation(val, range) {
      return val + (Math.random() * 2 - 1) * range;
    }
    function getTrainBoardColor(base) {
      let h = randomVariation(base.h, 5);
      let s = randomVariation(base.s, 5);
      let l = randomVariation(base.l, 5);
      return `hsl(${h.toFixed(0)}, ${s.toFixed(0)}%, ${l.toFixed(0)}%)`;
    }
    function getRandomGreen() {
      let s = 50 + Math.random() * 50;
      let l = 30 + Math.random() * 40;
      return `hsl(120, ${s.toFixed(0)}%, ${l.toFixed(0)}%)`;
    }

    // ------------------------------
    // Board & Drawing Functions
    // ------------------------------
    function measureGrid() {
      const width = boardArea.clientWidth;
      const height = boardArea.clientHeight;
      const targetTileSize = Math.max(38, width / 52, height / 36);
      columns = Math.max(6, Math.round(width / targetTileSize));
      rows = Math.max(6, Math.round(height / targetTileSize));
    }

    function resizeBoard() {
      if (!mode) measureGrid();
      const width = boardArea.clientWidth;
      const height = boardArea.clientHeight;
      const normalSize = Math.min(width / columns, height / rows);
      const rotatedSize = Math.min(width / rows, height / columns);
      // Rotate the view when it fits better. The snake and its target stay in game coordinates.
      rotated = rotatedSize > normalSize * 1.08;
      cellSize = Math.max(1, Math.floor(rotated ? rotatedSize : normalSize));

      const cssWidth = (rotated ? rows : columns) * cellSize;
      const cssHeight = (rotated ? columns : rows) * cellSize;
      const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      canvas.style.width = `${cssWidth}px`;
      canvas.style.height = `${cssHeight}px`;
      const pixelWidth = Math.round(cssWidth * pixelRatio);
      const pixelHeight = Math.round(cssHeight * pixelRatio);
      if (canvas.width !== pixelWidth) canvas.width = pixelWidth;
      if (canvas.height !== pixelHeight) canvas.height = pixelHeight;
      ctx.setTransform(pixelWidth / cssWidth, 0, 0, pixelHeight / cssHeight, 0, 0);
      draw();
    }

    function screenX(x, y) {
      return (rotated ? rows - 1 - y : x) * cellSize;
    }

    function screenY(x, y) {
      return (rotated ? x : y) * cellSize;
    }

    function drawBoard() {
      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < columns; col++) {
          const chessColor = (row + col) % 2 === 0 ? "#eed8b5" : "#d4b78d";
          ctx.fillStyle = mode === "train" ? trainBoardColors[row][col] : chessColor;
          ctx.fillRect(screenX(col, row), screenY(col, row), cellSize, cellSize);
        }
      }
    }

    function drawSnake() {
      for (let i = 0; i < snake.length; i++) {
        const segment = snake[i];
        const x = screenX(segment.x, segment.y);
        const y = screenY(segment.x, segment.y);
        const lightness = 30 + 40 * i / Math.max(1, snake.length - 1);
        ctx.fillStyle = mode === "train" ? segment.color : `hsl(120, 100%, ${lightness}%)`;
        ctx.fillRect(x, y, cellSize, cellSize);
        if (i === 0) {
          ctx.fillStyle = "#142518";
          ctx.fillText(mode === "train" ? "🐸" : "🐲", x + cellSize / 2, y + cellSize / 2);
        }
      }
    }

    function drawTreat() {
      if (!treat) return;
      const x = screenX(treat.x, treat.y) + cellSize / 2;
      const y = screenY(treat.x, treat.y) + cellSize / 2;
      ctx.beginPath();
      ctx.arc(x, y, cellSize * 0.43, 0, Math.PI * 2);
      ctx.fillStyle = "#fff8dc";
      ctx.fill();
      ctx.strokeStyle = "#364732";
      ctx.lineWidth = Math.max(1, cellSize / 23);
      ctx.stroke();
      ctx.fillStyle = "#142518";
      ctx.fillText(mode === "chess" ? "♟️" : "🍎", x, y);
    }

    function draw() {
      drawBoard();
      ctx.font = `${cellSize * 0.73}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      drawSnake();
      drawTreat();
    }

    // ------------------------------
    // Stats Display (including treats eaten)
    // ------------------------------
    function updateStats() {
      const elapsed = ((performance.now() - startTime) / 1000).toFixed(2);
      stats.textContent = `⏱️ ${elapsed} s · 🦶🏼 ${tickCount} · 🍽️ ${treatsEaten}`;
    }

    function setHint(message = defaultHint) {
      if (hint.textContent !== message) hint.textContent = message;
    }

    // ------------------------------
    // Final Score Emoji Mappings (all positive)
    // ------------------------------
    function getChessModeEmoji(score) {
      const mapping = [
        { threshold: 2, emoji: "🐶" },
        { threshold: 3, emoji: "🐱" },
        { threshold: 4, emoji: "🐰" },
        { threshold: 5, emoji: "🐼" },
        { threshold: 6, emoji: "🐨" },
        { threshold: 7, emoji: "🦊" },
        { threshold: 8, emoji: "🦄" },
        { threshold: 9, emoji: "🐯" },
        { threshold: 10, emoji: "🐮" },
        { threshold: 11, emoji: "🐷" },
        { threshold: 12, emoji: "🐵" },
        { threshold: 13, emoji: "🍏" },
        { threshold: 14, emoji: "🍎" },
        { threshold: 15, emoji: "🍊" },
        { threshold: 16, emoji: "🍓" },
        { threshold: 17, emoji: "🍒" },
        { threshold: 18, emoji: "🍇" },
        { threshold: 19, emoji: "🍉" },
        { threshold: 20, emoji: "🍌" },
        { threshold: 21, emoji: "❤️" },
        { threshold: 22, emoji: "💛" },
        { threshold: 23, emoji: "💚" },
        { threshold: 24, emoji: "💙" },
        { threshold: 25, emoji: "💜" },
        { threshold: 26, emoji: "✨" },
        { threshold: 27, emoji: "⭐" },
        { threshold: 28, emoji: "🌟" },
        { threshold: 29, emoji: "🔥" },
        { threshold: 30, emoji: "🎉" }
      ];
      for (let i = 0; i < mapping.length; i++) {
        if (score <= mapping[i].threshold) {
          return "♟️🏅 " + mapping[i].emoji;
        }
      }
      return "♟️🏅 🎉";
    }

    function getTrainModeEmoji(score) {
      const mapping = [
        { threshold: 50, emoji: "🐶" },
        { threshold: 100, emoji: "🐱" },
        { threshold: 150, emoji: "🐰" },
        { threshold: 200, emoji: "🐼" },
        { threshold: 250, emoji: "🐨" },
        { threshold: 300, emoji: "🦊" },
        { threshold: 350, emoji: "🦄" },
        { threshold: 400, emoji: "🐯" },
        { threshold: 410, emoji: "🐮" },
        { threshold: 420, emoji: "🐷" },
        { threshold: 430, emoji: "🐵" },
        { threshold: 440, emoji: "🍏" },
        { threshold: 450, emoji: "🍎" },
        { threshold: 460, emoji: "🍊" },
        { threshold: 470, emoji: "🍓" },
        { threshold: 480, emoji: "🍒" },
        { threshold: 490, emoji: "🍇" },
        { threshold: 500, emoji: "🍉" },
        { threshold: 510, emoji: "🍌" },
        { threshold: 520, emoji: "❤️" },
        { threshold: 530, emoji: "💛" },
        { threshold: 540, emoji: "💚" },
        { threshold: 550, emoji: "💙" },
        { threshold: 560, emoji: "💜" },
        { threshold: 570, emoji: "✨" },
        { threshold: 580, emoji: "⭐" },
        { threshold: 590, emoji: "🌟" },
        { threshold: 600, emoji: "🔥" },
        { threshold: 610, emoji: "🎉" }
      ];
      for (let i = 0; i < mapping.length; i++) {
        if (score <= mapping[i].threshold) {
          return "🚂🏅 " + mapping[i].emoji;
        }
      }
      return "🚂🏅 🎉";
    }

    // ------------------------------
    // Game Logic and Tick Function
    // ------------------------------
    function gameTick() {
      if (!treat && mode === "chess") {
        updateStats();
        return;
      }

      let nextStep = treat ? findNextStep(treat) : null;
      if (treat && !nextStep) {
        // Let the body move out of the way for a few steps, then release a blocked target.
        if (detourSteps >= Math.min(snake.length, 12)) {
          treat = null;
          setHint("Food was blocked. Pick another tile.");
        } else {
          detourSteps++;
        }
      }
      if (!nextStep && (treat || mode === "train")) {
        nextStep = chooseFallback();
        if (!nextStep) {
          endGame();
          return;
        }
      }
      if (!nextStep) {
        updateStats();
        draw();
        return;
      }

      const ate = treat !== null && sameCell(nextStep, treat);
      snake.unshift(makeSegment(nextStep));
      if (ate) {
        treatsEaten++;
        treat = null;
        setHint();
      } else {
        snake.pop();
      }

      tickCount++;
      lastVisit[cellIndex(nextStep)] = tickCount + 1;
      if (tickCount % 10 === 0) currentTickInterval *= 0.99;
      if (ate && mode === "train") currentTickInterval *= 0.98;
      currentTickInterval = Math.max(minimumTick, currentTickInterval);
      updateStats();
      draw();
      playMoveSounds(nextStep, ate);
      if (snake.length === columns * rows) endGame(true);
    }

    function tick() {
      tickTimeout = null;
      if (gameOver) return;
      gameTick();
      if (!gameOver) tickTimeout = setTimeout(tick, currentTickInterval);
    }

    // ------------------------------
    // Collision and Pathfinding
    // ------------------------------
    function sameCell(a, b) {
      return a.x === b.x && a.y === b.y;
    }

    function isCellInList(cell, list) {
      return list.some(item => sameCell(item, cell));
    }

    function isOnBoard({ x, y }) {
      return x >= 0 && x < columns && y >= 0 && y < rows;
    }

    function cellIndex({ x, y }) {
      return y * columns + x;
    }

    function neighborsOf({ x, y }) {
      return [
        { x, y: y - 1 }, { x, y: y + 1 }, { x: x - 1, y }, { x: x + 1, y }
      ].filter(isOnBoard);
    }

    function findNextStep(goal) {
      // On a non-growing move the tail vacates its tile.
      const visited = new Set(snake.slice(0, -1).map(cellIndex));
      visited.add(cellIndex(snake[0]));
      const queue = [{ cell: snake[0], firstStep: null }];
      for (let i = 0; i < queue.length; i++) {
        const { cell, firstStep } = queue[i];
        for (const neighbor of neighborsOf(cell)) {
          const index = cellIndex(neighbor);
          if (visited.has(index)) continue;
          const step = firstStep ?? neighbor;
          if (sameCell(neighbor, goal)) return step;
          visited.add(index);
          queue.push({ cell: neighbor, firstStep: step });
        }
      }
      return null;
    }

    function chooseFallback() {
      const body = snake.slice(0, -1);
      const available = neighborsOf(snake[0]).filter(cell => !isCellInList(cell, body));
      if (available.length === 0) return null;
      // Favor tiles visited longest ago to break short, repetitive loops.
      const oldestVisit = Math.min(...available.map(cell => lastVisit[cellIndex(cell)]));
      const choices = available.filter(cell => lastVisit[cellIndex(cell)] === oldestVisit);
      return mode === "train" ? choices[Math.floor(Math.random() * choices.length)] : choices[0];
    }

    // ------------------------------
    // Game End and Overlay (Score Display with Animation)
    // ------------------------------
    function endGame(boardCleared = false) {
      gameOver = true;
      clearTimeout(tickTimeout);
      tickTimeout = null;
      updateStats();
      const emoji = mode === "chess" ? getChessModeEmoji(tickCount) : getTrainModeEmoji(tickCount);
      overlayTitle.textContent = boardCleared ? "Board cleared!" : "Play again?";
      overlayMessage.textContent = `${emoji} · ${stats.textContent}`;
      overlayMessage.classList.add(mode === "chess" ? "chessFinishAnimation" : "trainFinishAnimation");
      overlay.hidden = false;
    }

    // ------------------------------
    // Initialization & Mode Setup
    // ------------------------------
    function makeSegment({ x, y }) {
      return mode === "train" ? { x, y, color: getRandomGreen() } : { x, y };
    }

    function initGame(selectedMode) {
      clearTimeout(tickTimeout);
      mode = selectedMode;
      measureGrid();
      const x = Math.floor(columns / 2);
      const y = Math.floor(rows / 2);
      snake = [makeSegment({ x, y }), makeSegment({ x: x - 1, y }), makeSegment({ x: x - 2, y })];
      lastVisit = new Int32Array(columns * rows);
      for (const segment of snake) lastVisit[cellIndex(segment)] = 1;
      treat = null;
      detourSteps = 0;
      tickCount = 0;
      treatsEaten = 0;
      gameOver = false;
      startTime = performance.now();
      currentTickInterval = fixedTick;
      if (mode === "train") {
        const base = chooseTrainBoardBase();
        trainBoardColors = Array.from({ length: rows }, () =>
          Array.from({ length: columns }, () => getTrainBoardColor(base)));
      }
      overlayMessage.classList.remove("chessFinishAnimation", "trainFinishAnimation");
      overlay.hidden = true;
      setHint();
      updateStats();
      resizeBoard();
      enableAudio();
      tickTimeout = setTimeout(tick, currentTickInterval);
    }

    // ------------------------------
    // Place or Move Food
    // ------------------------------
    canvas.addEventListener("click", event => {
      if (gameOver) return;
      const rect = canvas.getBoundingClientRect();
      const x = Math.floor((event.clientX - rect.left) / cellSize);
      const y = Math.floor((event.clientY - rect.top) / cellSize);
      const cell = rotated ? { x: y, y: rows - 1 - x } : { x, y };
      if (!isOnBoard(cell) || isCellInList(cell, snake)) return;
      treat = cell;
      detourSteps = 0;
      setHint();
      draw();
      enableAudio();
    });

    document.getElementById("chessButton").addEventListener("click", () => initGame("chess"));
    document.getElementById("trainButton").addEventListener("click", () => initGame("train"));
    window.addEventListener("resize", resizeBoard);
    if (typeof ResizeObserver !== "undefined") new ResizeObserver(resizeBoard).observe(boardArea);
    resizeBoard();
  </script>
</body>
</html>
